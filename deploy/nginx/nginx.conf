# ============================================================================
# Bank-Grade Nginx Configuration with Mutual TLS (mTLS) & WebSocket Proxy
# Target: High-security bank infrastructure / PCI-DSS compliance
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Strip Nginx version banner (OWASP)

    # Logging format for SIEM ingestion (includes mTLS client DN and TLS cipher)
    log_format siem_json escape=json '{'
        '"@timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"mtls_client_dn":"$ssl_client_s_dn",'
        '"mtls_verify_status":"$ssl_client_verify"'
    '}';

    access_log /var/log/nginx/access_siem.log siem_json;

    # Rate limiting zones to prevent Denial of Service on ATM endpoints
    limit_req_zone $binary_remote_addr zone=atm_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=mobile_limit:10m rate=5r/s;

    # Upstream Go backend
    upstream backend_nodes {
        server backend:4000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ========================================================================
    # Shared TLS 1.3 Security Baseline
    # ========================================================================
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Diffie-Hellman & Elliptic Curve parameters
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # ========================================================================
    # 1. ATM TERMINAL HARDWARE PORT (mTLS ENFORCED) - Port 443
    # Every physical ATM kiosk MUST present a valid X.509 client certificate
    # signed by the Bank's Private Root Certificate Authority.
    # ========================================================================
    server {
        listen 443 ssl default_server;
        server_name atm.internal.bank.net;

        # Server Certificate
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Mutual TLS: Bank Root CA that issued ATM Hardware Certificates
        ssl_client_certificate /etc/nginx/certs/bank_ca.crt;
        ssl_verify_client on; # HARD REJECT any connection without valid bank client cert
        ssl_verify_depth 2;

        # Enterprise HTTP Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:;" always;

        # Block customer mobile approval on ATM terminal gateway (Segmentation enforcement - CODE-020)
        location = /api/session/approve {
            return 403 '{"error":"forbidden","message":"Session approval is only permitted via Mobile Gateway (port 8443)"}';
        }

        # REST Endpoints for ATM
        location /api/ {
            limit_req zone=atm_limit burst=10 nodelay;

            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Pass mTLS verified client identity to the Go backend
            proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        }

        # WebSocket endpoint for real-time ATM screen unlock
        location /ws {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Static ATM Simulator UI
        location / {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
        }
    }

    # ========================================================================
    # 2. CUSTOMER MOBILE APP APPROVAL GATEWAY - Port 8443
    # Standard TLS 1.3 with Certificate Pinning support (no client cert needed)
    # ========================================================================
    server {
        listen 8443 ssl;
        server_name mobile.bank.net;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Enterprise HTTP Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location /api/session/approve {
            limit_req zone=mobile_limit burst=5 nodelay;

            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/health {
            proxy_pass http://backend_nodes;
        }

        # Deny all other internal ATM endpoints on this mobile port
        location / {
            return 404;
        }
    }
}
