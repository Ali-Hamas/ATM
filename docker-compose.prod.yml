# ============================================================================
# Bank-Grade Production Orchestration: Cardless ATM Middleware
# Target: Private Bank Cloud / On-Premise K8s/Docker Swarm Deployments
# Compliance: PCI-DSS 10.5, SOC2 Type II, ISO 27001
# ============================================================================

version: '3.8'

networks:
  bank-internal:
    driver: bridge
    internal: true # No direct internet egress from data layer (zero-trust architecture)
  bank-public:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  nginx_logs:

services:
  # --------------------------------------------------------------------------
  # 1. Go Authentication Middleware (Stateless Microservice)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    restart: always
    environment:
      - ENV=production
      - PORT=4000
      - SESSION_TTL_SECONDS=60
      - REDIS_REQUIRED=true
      - DATABASE_REQUIRED=true
      - REQUIRE_MTLS=true
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-bank-secure-redis-pass}@redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgres://atm_auth_app:${DB_PASSWORD:-bank-secure-db-pass}@postgres:5432/atm_auth?sslmode=require}
      - ENABLE_AUDIT_API=false # Protected: audit records stream directly to SIEM sink
      - ALLOWED_ORIGINS=https://atm.internal.bank.net,https://mobile.bank.net
    networks:
      - bank-internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # --------------------------------------------------------------------------
  # 2. Redis Distributed Session Cluster (Atomic Lua State Machine)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: always
    command: >
      redis-server
      --requirepass bank-secure-redis-pass
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-ttl
      --protected-mode yes
    volumes:
      - redis_data:/data
    networks:
      - bank-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bank-secure-redis-pass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # --------------------------------------------------------------------------
  # 3. PostgreSQL Immutable Audit Database (Append-Only SIEM Storage)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: atm_auth
      POSTGRES_USER: atm_auth_app
      POSTGRES_PASSWORD: bank-secure-db-pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-go/migrations/001_create_audit_log.sql:/docker-entrypoint-initdb.d/001_create_audit_log.sql:ro
    networks:
      - bank-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm_auth_app -d atm_auth"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # --------------------------------------------------------------------------
  # 4. Nginx Reverse Proxy with Mutual TLS (mTLS) & TLS 1.3 Termination
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      # Port 443: ATM Terminal Hardware Network (mTLS required via Bank CA)
      - "443:443"
      # Port 8443: Mobile App Gateway (TLS 1.3 with Certificate Pinning)
      - "8443:8443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - bank-internal
      - bank-public
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8443/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
